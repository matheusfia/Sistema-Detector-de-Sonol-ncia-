program: treinamento_usando_mobilenet_v2.py

method: bayes

metric:
  name: val_loss
  goal: minimize

parameters:

  img_size:
    values: [224]

  batch_size:
    values: [16, 32]

  epochs:
    values: [30]

  learning_rate:
    distribution: log_uniform_values
    min: 1e-05
    max: 1e-03

  dense_units:
    values: [128, 224, 256]

  dropout:
    distribution: uniform
    min: 0.2
    max: 0.6

  l2:
    distribution: log_uniform_values
    min: 1e-05
    max: 1e-03

  unfreeze_layers:
    values: [20, 30]
