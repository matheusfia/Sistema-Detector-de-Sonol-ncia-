program: treinamento_usando_resnet101.py
method: random

metric:
  name: val_loss
  goal: minimize

parameters:

  l2:
    distribution: log_uniform
    min: 0.0001
    max: 0.01

  batch_size:
    values: [16, 32, 64]

  unfreeze_layers:
    values: [10, 20, 30, 40]

  learning_rate:
    values: [1e-4, 3e-5, 1e-5]

  dense_units:
    values: [128, 256]

  dropout:
    min: 0.3
    max: 0.6

  epochs:
    value: 30
